# экономическое обоснование (на 1000 исследований). Все цифры — ДОПУЩЕНИЯ,
# их нужно заменить данными клиники. Считаем ТОЛЬКО прирост:
# клинические доли (сколько находок, сколько операций показано) одинаковы
# в обоих вариантах, меняется только доходимость пациента до врача
studies: 1000                    # число исследований
trigger_rate: 0.12               # доля исследований со значимой находкой (одинакова «до» и «после»)
reach_specialist_without: 0.45   # доля дошедших до профильного врача БЕЗ системы (допущение)
reach_specialist_with: 0.66      # доля дошедших С системой (допущение, проверяется пилотом)
surgery_indicated_share: 0.40    # доля дошедших, кому показана операция (клиническая, НЕ меняется)
surgery_accept_share: 0.75       # доля согласившихся на операцию в клинике (НЕ меняется)
consult_price: 3500              # средний чек консультации, руб
surgery_price: 85000             # средний чек операции, руб
margin: 0.30                     # маржинальность
admin_minutes_saved_per_case: 12 # экономия времени координатора на один случай, мин
admin_cost_per_hour: 600         # стоимость часа координатора, руб
