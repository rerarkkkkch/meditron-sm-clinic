# матрица маршрутизации, сроки, тексты сообщений, напоминания
# тоже настройка, а не код. Меняется без программиста

version: "0.3.0"                    # версия матрицы — пишется в журнал

# 1. маршруты. Несколько находок с одинаковым route = ОДИН маршрут
# (например, полип + гиперплазия эндометрия -> один визит к гинекологу)
# находки с разными route = РАЗНЫЕ маршруты у одного пациента
routes:
  gyn_surgeon:
    specialist: Оперирующий гинеколог          # кого видит админ
    specialist_for_patient: врача-гинеколога   # как пишем пациенту (нейтрально)
    aliases: [гинеколог, акушер-гинеколог, оперирующий гинеколог]  # как врач УЗИ может написать в рекомендации
    target_days: 7                             # целевой срок до консультации
    department: Координатор хирургического маршрута
    possible_next: [Гистероскопия, Гистерорезектоскопия, РДВ]  # только для врача, пациенту не показываем

  surgeon:
    specialist: Хирург
    specialist_for_patient: врача-хирурга
    aliases: [хирург, абдоминальный хирург]
    target_days: 14
    department: Координатор хирургического маршрута
    possible_next: [Лапароскопическая холецистэктомия, Герниопластика]

  mammolog:
    specialist: Маммолог / онколог
    specialist_for_patient: врача-маммолога
    aliases: [маммолог, онколог, онкомаммолог]
    target_days: 5
    department: Координатор онкологического маршрута
    possible_next: [Биопсия]

  endocrinologist:
    specialist: Эндокринолог
    specialist_for_patient: врача-эндокринолога
    aliases: [эндокринолог]
    target_days: 14
    department: Координатор терапевтического маршрута
    possible_next: [ТАБ узла]

  urologist:
    specialist: Уролог
    specialist_for_patient: врача-уролога
    aliases: [уролог]
    target_days: 10
    department: Координатор хирургического маршрута
    possible_next: [Консультация уролога, КТ мочевых путей]

  vascular_surgeon:
    specialist: Сосудистый хирург / флеболог
    specialist_for_patient: врача — сосудистого хирурга
    aliases: [сосудистый хирург, флеболог, ангиохирург, сердечно-сосудистый хирург]
    target_days: 21
    department: Координатор хирургического маршрута
    possible_next: [Склеротерапия, ЭВЛК, Ангиография]

  therapist:
    specialist: Терапевт (дообследование)
    specialist_for_patient: врача-терапевта
    aliases: [терапевт, гастроэнтеролог, гематолог, онколог-терапевт]
    target_days: 14
    department: Координатор терапевтического маршрута
    possible_next: [КТ, Лабораторные анализы]

  urgent_staff:
    specialist: Дежурный врач (экстренно)
    specialist_for_patient: ""
    aliases: []
    target_days: 0
    department: Старший врач смены
    escalation_only: true                      # пациенту автоматически НЕ пишем, только персоналу

# 2. поведение системы
behavior:
  admin_push_on_new_route: true                # пуш админу сразу, как найдена находка
  require_admin_verification: true             # пациенту пишем только после подтверждения админа
  auto_verify_if_clinician_agrees: false       # true = если врач УЗИ сам рекомендовал того же специалиста, не ждать админа
  max_patient_messages_per_day: 2              # защита от «переспама»
  no_show_message_delay_hours: 1               # через сколько после неявки написать пациенту
  quiet_send_hour: 10                          # во сколько отправлять отложенные антиспамом (часовой пояс сервера: задайте TZ)
  verification_sla_hours: 24                   # срок на верификацию админом, потом эскалация
  urgent_ack_minutes: 15                       # экстренный маршрут без «принято» — повторная эскалация
  push_title: СМ-Клиника                       # заголовок пуш-уведомления пациенту
  push_on_lock_screen: full                    # full — нейтральный текст целиком; generic — только «новое сообщение в личном кабинете»

# 3. лестница напоминаний (сценарии 2 и 3 из ТЗ). Часы — модельное время
# от момента уведомления пациента (или от неявки/отмены)
# action: patient_message — сообщение пациенту; admin_task — задача админу;
# set_status — сменить статус маршрута
reminders:
  - {after_hours: 24,  action: patient_message, template: reminder_24h}
  - {after_hours: 72,  action: patient_message, template: reminder_72h, channels: [sms, push]}
  - {after_hours: 168, action: admin_task,      template: call_script}
  - {after_hours: 336, action: patient_message, template: final_soft}
  - {after_hours: 720, action: set_status,      status: not_engaged}

# 4. тексты. Правило: НЕ называем находку пациенту и не пугаем: только «плановая
# консультация», «незавершённый маршрут обследования». Минимум медицинской информации в push/SMS
# {specialist} подставляется из specialist_for_patient
templates:
  # тексты для пациента переписаны нейтрально: без слов «изменения», «находка», «патология»; только «плановая консультация»
  # их можно менять из интерфейса (Настройки -> Сценарий уведомлений) — там же встроена проверка на нейтральность
  admin_new: "Новая находка: пациент {patient}, {study}. Маршрут: {route_specialist}. Приоритет {priority}. Требуется верификация."
  admin_urgent: "ЭКСТРЕННО: пациент {patient}, {study}. Требуется немедленная оценка дежурным врачом."
  first_notice: "Здравствуйте! Ваше исследование обработано. Чтобы завершить обследование, рекомендуем плановую консультацию {specialist} — это обычный следующий шаг: врач посмотрит результаты вместе с вами и даст рекомендации. Выберите удобное время — очно или онлайн."
  reminder_24h: "Напоминаем: в вашем маршруте обследования остался один шаг — консультация {specialist}. Записаться можно в удобное время, очно или онлайн."
  reminder_72h: "У вас есть незавершённый маршрут обследования. Рекомендуем записаться на консультацию врача — подобрать удобное время можно по ссылке."
  call_script: "Позвонить пациенту {patient}. Скрипт: «Добрый день! Вы недавно проходили у нас обследование. Чтобы его завершить, рекомендована плановая консультация {specialist}. Могу помочь подобрать удобное время — очно или онлайн». Не называть находку и не обсуждать результаты по телефону."
  final_soft: "Мы заботимся о вашем здоровье и напоминаем о плановой консультации по итогам недавнего обследования. Если вы уже были у врача, отметьте это в личном кабинете — больше напоминаний не будет."
  no_show: "Похоже, консультация сегодня не состоялась — ничего страшного. Выберите другое удобное время, очно или онлайн."
  booked: "Вы записаны: {slot}. До встречи!"
