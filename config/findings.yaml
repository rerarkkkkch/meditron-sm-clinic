# словарь находок (упрощённый). Это НАСТРОЙКА, а не код
# чтобы добавить новый триггер — допишите блок в раздел findings
# и (при необходимости) маршрут в routes.yaml. Перезапуск не нужен:
# файл перечитывается автоматически при изменении
# все слова можно писать в любой форме ("желчного пузыря" = "желчный пузырь"):
# система сама приводит их к начальной форме (лемме) и терпит опечатки

version: "0.6.0"            # версия словаря — попадает в объяснение каждого срабатывания

# параметры поиска (можно подкручивать по результатам scripts/evaluate.py)
matching:
  fuzzy_threshold: 85       # 0..100: насколько терпим к опечаткам (меньше = терпимее, но больше ложных)
  max_gap: 1                # сколько «лишних» слов допускается внутри фразы ("полип [в] эндометрии")
  negation_window: 4        # на сколько слов вокруг находки ищем отрицание
  modifier_window: 5        # на сколько слов ищем «неуверенность», «анамнез», исключения
  negation_before_window: 6 # окно «отрицание ПЕРЕД находкой» (в своей части предложения)
  negation_after_window: 8  # окно «отрицание ПОСЛЕ находки» (в своей части предложения)
  fuzzy_only_unknown_words: true   # нечётко (опечатки) сравниваем только слова, которых нет в словаре русского языка
  join_colon_lines: false   # склейка «Ключ:»+значение. Замер на 146 реальных+интернет протоколах: 0 изменений -> ВЫКЛЮЧЕНО (см. ПОМЕТКИ)

# второй контур — обученная локальная модель («страховочная сеть» для пропущенных формулировок)
# модель обучает scripts/train.py; выключить контур — enabled: false
ml:
  enabled: true
  model_path: models/second_layer.joblib
  miss_threshold: 0.9       # детектор пропусков ВКЛЮЧЁН (по решению команды, без переобучения). Его находки всегда
                            # с пометкой «проверить» и никогда не уходят пациенту автоматически. Выключить: 1.01
  fp_threshold: 0.4         # верификатор: ниже — «вероятно ложное» (CV: помечает ~56% ложных, задевает ~3% настоящих)
  # верификатору доверяем только по типам, где в обучении было ≥5 настоящих примеров (data/real + data/web)
  # по остальным (полип ЖП, камни почек, грыжа, гидронефроз, субмукозная миома…) настоящих примеров было 0 —
  # модель помечала «Полип ЖП 12 мм» как ложный (p=0.01). После переобучения на больших данных список можно убрать
  verifier_trusted_types: [uterine_myoma, bph, ovarian_mass, adenomyosis, cholelithiasis, varicose_veins, thyroid_nodule, endometrial_polyp, breast_birads]

# 1. локализации (органы). Нужны для правил вида «ЧТО + ГДЕ»:
# "полип" + "эндометрий" = полип эндометрия, "полип" + "желчный пузырь" = полип ЖП
# система берёт БЛИЖАЙШИЙ к находке орган (с приоритетом той же части
# предложения между запятыми) — так "полип" не перепутается между органами
locations:
  # аббревиатуры пишите ЗАГЛАВНЫМИ (ОБА, ЖП): они совпадают только с точным написанием, без начальных форм
  # и опечаток. Иначе «ОБА» (общая бедренная артерия) совпадала со словом «обеих» (начальная форма «оба»)
  # органы, к которым привязаны находки словаря
  endometrium: [эндометрий, полость матки, м-эхо]          # слизистая матки
  uterus:      [матка, миометрий, тело матки]              # тело матки
  ovary:       [яичник, придаток]                          # яичники
  breast:      [молочная железа, грудная железа]           # молочные железы
  gallbladder: [желчный пузырь, ЖП]                        # желчный пузырь
  kidney:      [почка, чашечно-лоханочная система, ЧЛС, мочеточник]  # почки и мочевые пути
  thyroid:     [щитовидная железа, ЩЖ, доля щитовидной]    # щитовидная железа
  prostate:    [предстательная железа, простата, переходная зона, транзиторная зона]   # предстательная железа
  leg_arteries: [бедренная артерия, подколенная артерия, большеберцовая артерия, берцовая артерия, артерия нижних конечностей, артерия голени, ОБА, ПБА, ГБА, ПКА, ПКЛА, ЗББА, ПББА]   # артерии ног
  # остальные органы и структуры. Находок к ним может и не быть: они нужны, чтобы правило
  # «ЧТО + ГДЕ» выбирало ПРАВИЛЬНЫЙ ближайший орган. Пример: «регионарные лимфатические узлы не изменены»
  # в протоколе щитовидной железы — ближайший орган «лимфоузлы», а не «щитовидная железа»
  # добавляйте сюда любые органы и синонимы — это безопасно
  lymph_nodes: [лимфатический узел, лимфоузел, лимфоузлы, ЛУ, лимфатический коллектор]
  cervix:      [шейка матки, цервикальный канал, эндоцервикс, экзоцервикс]
  fallopian:   [маточная труба, фаллопиева труба]
  vagina:      [влагалище, своды влагалища]
  bladder:     [мочевой пузырь]
  urethra:     [уретра, мочеиспускательный канал]
  adrenal:     [надпочечник]
  testis:      [яичко, мошонка, придаток яичка, семенной канатик]
  seminal:     [семенной пузырек]
  liver:       [печень, правая доля печени, левая доля печени, паренхима печени]
  bile_ducts:  [холедох, общий желчный проток, желчный проток, внутрипеченочный проток]
  pancreas:    [поджелудочная железа, вирсунгов проток, панкреатический проток]
  spleen:      [селезенка]
  stomach:     [желудок]
  intestine:   [кишечник, кишка, сигмовидная кишка, тонкая кишка, толстая кишка, аппендикс, червеобразный отросток]
  aorta:       [аорта, брюшная аорта, грудная аорта]
  vena_cava:   [нижняя полая вена, НПВ]
  portal_vein: [воротная вена, селезеночная вена, мезентериальная вена]
  heart:       [сердце, предсердие, желудочек сердца, ушко предсердия, клапан сердца]
  carotid:     [сонная артерия, ОСА, ВСА, НСА, брахиоцефальный ствол, позвоночная артерия]
  leg_veins:   [БПВ, МПВ, большая подкожная вена, малая подкожная вена, бедренная вена, подколенная вена, берцовая вена, суральная вена, вена голени, сафено-феморальное соустье, сафено-подколенное соустье, СФС, СПС]
  pelvic_veins: [вены малого таза, параметральные вены, яичниковая вена, аркуатные вены]
  parathyroid: [паращитовидная железа, околощитовидная железа]
  salivary:    [слюнная железа, околоушная железа, поднижнечелюстная железа]
  pleura:      [плевральная полость, плевральный синус]
  abdomen:     [брюшная полость, забрюшинное пространство]
  soft_tissue: [мягкие ткани, подкожная клетчатка, подкожно-жировая клетчатка]
  joints:      [коленный сустав, подколенная ямка, сустав]

# 2. общие «МОДИФИКАТОРЫ» — работают для всех находок сразу
modifiers:
  negation_before:            # отрицание ПЕРЕД находкой: "без признаков полипа"
    - без
    - нет
    - не выявлено              # формы слов неважны: "не выявлены" сработает так же
    - не обнаружено
    - не определяется
    - не визуализируется
    - не лоцируется
    - отсутствие
    - данных за                # "данных за ЖКБ нет"
    - исключен                 # "полип исключён"
  negation_after:             # отрицание ПОСЛЕ находки: "полипов не выявлено"
    - не выявлено
    - не обнаружено
    - не определяется
    - не визуализируется
    - не лоцируется
    - отсутствует
    - исключен
    - нет
  uncertainty:                # неуверенность — НЕ отменяет находку, но снижает уверенность
    - подозрение
    - вероятно
    - возможно
    - под вопросом
    - не исключен              # "не исключён полип" — это НЕ отрицание, а сомнение
    - нельзя исключить
  history:                    # упоминание в прошлом — находка не текущая
    - состояние после
    - в анамнезе
    - удален                   # "полип удалён"
    - после операции
  recurrence:                 # рецидив отменяет «анамнез»: «состояние после полипэктомии, вновь полип»
    - вновь
    - рецидив
    - повторно
    - снова
  scope_breakers: [но, однако, при этом]   # слова, через которые отрицание не «перепрыгивает»
  normal_phrases:             # фразы нормы — только для объяснения «почему триггера нет»
    - без патологии
    - вариант нормы
    - патологии не выявлено
    - без особенностей
  recommendation_markers: [рекомендовано, рекомендуется, рекомендация]  # предложения-рекомендации врача УЗИ

# 3. находки (триггеры). Поля:
# name — как показать врачу/админу
# route — ключ маршрута из routes.yaml (куда направить)
# priority — 1 высокий, 2 средний, 3 низкий (для сортировки в очереди)
# terms — самодостаточные термины ("холецистолитиаз", "ЖКБ")
# what+where — правило «ЧТО» + «ГДЕ» (where = ключ из locations)
# exclude — если рядом есть эти слова, находку НЕ считаем
# condition — числовое условие по атрибутам (size_mm, birads)
# on_missing_attribute — что делать, если атрибута нет в тексте:
# review = показать с пометкой «проверить», skip = не считать
# urgent — экстренная находка: только эскалация персоналу, пациенту не пишем
findings:

  endometrial_polyp:
    name: Полип эндометрия
    route: gyn_surgeon
    priority: 2
    terms: [полип эндометрия, полипоз эндометрия]
    what: [полип, полиповидный образование, полипозный образование]
    where: [endometrium]

  endometrial_hyperplasia:
    name: Гиперплазия эндометрия
    route: gyn_surgeon
    priority: 2
    terms: [гиперплазия эндометрия, гиперпластический процесс эндометрия]
    what: [гиперплазия, гиперпластический процесс]
    where: [endometrium]

  submucous_myoma:
    name: Субмукозный миоматозный узел
    route: gyn_surgeon
    priority: 2
    terms: [субмукозный миома, субмукозный узел, субмукозный миоматозный узел, подслизистый миоматозный узел]

  ovarian_mass:
    name: Образование яичника
    route: gyn_surgeon
    priority: 1
    terms: [кистома, эндометриома, тератома, дермоидный киста, гидросальпинкс, сактосальпинкс]
    what: [образование, объёмный образование, кистозный образование, солидный образование, эндометриоидный киста, киста, жидкостный образование, анэхогенный образование, гидросальпинкс]
    where: [ovary]
    exclude: [фолликулярный, фолликул, желтый тело, функциональный, яичко, мошонка]   # функциональные кисты и придаток яичка — не триггер

  breast_birads:
    name: Образование молочной железы BI-RADS 3–5
    route: mammolog
    priority: 1
    terms: [bi rads, би рэдс]
    what: [образование, узел, узловой образование]
    where: [breast]
    condition: {birads_min: 3}      # BI-RADS 1–2 — норма/доброкачественное, не триггер
    on_missing_attribute: review   # категории нет в тексте — показать админу с пометкой

  cholelithiasis:
    name: Желчнокаменная болезнь
    route: surgeon
    priority: 2
    terms: [желчнокаменный болезнь, жкб, холецистолитиаз, холелитиаз, калькулезный холецистит, конкремент желчный пузырь, камень желчный пузырь]
    what: [конкремент, камень, гиперэхогенный включение с акустической тенью]
    where: [gallbladder, bile_ducts]   # камень в холедохе (холедохолитиаз) — тоже ЖКБ, хирург

  gallbladder_polyp:
    name: Полип желчного пузыря ≥ 10 мм
    route: surgeon
    priority: 3
    what: [полип, полиповидный образование, пристеночный образование]
    where: [gallbladder]
    condition: {size_mm_min: 10}    # мелкие полипы — наблюдение, не хирургия
    on_missing_attribute: review

  thyroid_nodule:
    name: Узловое образование щитовидной железы
    route: endocrinologist
    priority: 3
    terms: [узловой зоб, многоузловой зоб]
    what: [узел, узловой образование, образование]
    where: [thyroid]

  hernia:
    name: Грыжа
    route: surgeon
    priority: 3
    terms: [грыжа, грыжевой выпячивание, грыжевой мешок]
    exclude: [диск, межпозвонковый, позвонок, шморль]   # грыжа диска — другой профиль, не этот маршрут
    context_sensitive: true          # контекстное слово («грыжа диска», «грыжа Шморля» — не хирург общего профиля)

  hydronephrosis:
    name: Гидронефроз / расширение ЧЛС
    route: urologist
    priority: 2
    terms: [гидронефроз, гидронефротический трансформация, каликоэктазия, расширение члс, расширение чашечно-лоханочная система]

  urolithiasis:
    name: Конкременты почек / мочевых путей
    route: urologist
    priority: 2
    terms: [нефролитиаз, уролитиаз, мочекаменный болезнь]
    what: [конкремент, камень]
    where: [kidney, bladder]           # камень мочевого пузыря — тоже уролог

  acute_cholecystitis:
    name: Признаки острого холецистита
    route: urgent_staff
    priority: 1
    urgent: true                    # экстренно: эскалация персоналу, без сообщения пациенту
    terms: [острый холецистит, деструктивный холецистит]

  # добавлено по итогам разметки реальных протоколов (data/real). Формулировки — по стандартной
  # терминологии УЗ-заключений. Требуют проверки медэкспертом (особенно — считать ли триггером аденомиоз
  # и пороги для атеросклероза)
  uterine_myoma:
    name: Миома матки (интрамуральная/субсерозная)
    route: gyn_surgeon
    priority: 3
    terms: [миома матки, лейомиома матки, лейомиома, фибромиома, многоузловой миома, миоматозный узел, миома]
    what: [узел, интерстициальный узел, интрамуральный узел, субсерозный узел, интерстициально-субсерозный узел]
    where: [uterus]
    exclude: [субмукозный, подслизистый, лимфатический]      # субмукозная — отдельная находка

  adenomyosis:
    name: Аденомиоз / внутренний эндометриоз
    route: gyn_surgeon
    priority: 3
    terms: [аденомиоз, внутренний эндометриоз, эндометриоз тело матки, эндометриоз матки, диффузный форма эндометриоз]

  endometrial_pathology:
    name: Патология эндометрия (неуточнённая)
    subsumed_by: [endometrial_polyp, endometrial_hyperplasia]   # если найдена более точная находка — эту не показываем
    route: gyn_surgeon
    priority: 2
    terms: [патология эндометрия, несоответствие толщина эндометрия, неоднородный эндометрий, неоднородный структура эндометрия]

  cervical_polyp:
    name: Полип цервикального канала
    route: gyn_surgeon
    priority: 2
    terms: [полип шейка матки, полип цервикальный канал, полип эндоцервикс]

  uterine_prolapse:
    name: Опущение матки
    route: gyn_surgeon
    priority: 2
    terms: [опущение матки, выпадение матки, пролапс матки, пролапс тазовый орган, опущение стенка влагалище]

  bph:
    name: Гиперплазия предстательной железы (ДГПЖ)
    route: urologist
    priority: 3
    terms: [дгпж, доброкачественный гиперплазия предстательный железа, гиперплазия предстательный железа, аденома простата, аденома предстательный железа, аденоматозный узел, гиперплазия переходный зона]
    what: [гиперплазия, аденома, увеличение объем, увеличение размер]
    where: [prostate]

  varicose_veins:
    name: Варикозная болезнь вен нижних конечностей
    route: vascular_surgeon
    priority: 3
    terms: [варикозный болезнь, варикозный расширение вен нижний конечность, варикозный трансформация, варикозный деформация, варикозный приток, несостоятельность ствол, несостоятельность бпв, несостоятельность мпв, несостоятельность сафено, сафено-подколенный соустье несостоятельный, сафено-феморальный соустье несостоятельный, недостаточность сафено, недостаточность клапан бпв, варикозно расширенный, рефлюкс по бпв, рефлюкс по мпв]
    exclude: [малый таз, параметральный, яичниковый, аркуатный]   # вены малого таза — другой профиль

  pad_atherosclerosis:
    name: Стенозирующий атеросклероз артерий ног (≥40% / окклюзия)
    route: vascular_surgeon
    priority: 2
    terms: [стенозирующий атеросклероз, атеросклероз артерия нижний конечность, атеросклероз сосуд нижний конечность, гемодинамически значимый стеноз, гемодинамически значимый атеросклероз, окклюзия]
    what: [стеноз, стенозирующий бляшка]
    where: [leg_arteries]
    exclude: [сонный, ВСА, ОСА, НСА, брахиоцефальный, БЦА, позвоночный]   # сонные артерии — отдельная находка
    condition: {stenosis_min: 40}     # порог согласовать с сосудистым хирургом
    on_missing_attribute: review

  venous_thrombosis:
    name: Тромбоз вен нижних конечностей
    route: urgent_staff
    priority: 1
    urgent: true                    # экстренно: эскалация персоналу (риск ТЭЛА)
    terms: [тромбоз глубокий вен, флеботромбоз, окклюзивный тромбоз, неокклюзивный тромбоз, флотирующий тромб, тромбоз суральный вен, тромбоз бедренный вен, тромбоз подколенный вен, тромбофлебит, тромботический масса, тромб]
    # контекстное СЛОВО. «Тромб» бывает не только в венах ног (аорта, сердце, воротная вена)
    # исключения ниже действуют на всё предложение (exclude_scope: sentence). Новые исключения можно
    # добавить без программиста: интерфейс -> вкладка «Словарь» -> «Добавить исключение»
    context_sensitive: true
    exclude_scope: sentence
    exclude: [аорта, аневризма, предсердие, ушко, желудочек сердца, сердце, воротная вена, селезеночная вена, почечная вена, мезентериальная вена, нижняя полая вена]

  # внематочная беременность — экстренно, а не планово как «образование яичника»
