  ectopic_pregnancy:
    name: Внематочная беременность (подозрение)
    route: urgent_staff
    priority: 1
    urgent: true
    terms: [внематочный беременность, эктопический беременность, трубный беременность, шеечный беременность, беременность в рубец]

  # расширение 0.6: популярные органы вне шести типов исследований из кейса
  # формулировки по стандартной терминологии УЗ-заключений, пороги и маршруты согласовать с медэкспертом
  liver_focal_lesion:
    name: Очаговое образование печени
    route: surgeon
    priority: 2
    terms: [опухоль печень, гемангиома печень, аденома печень]
    what: [образование, очаговый образование, объёмный образование, солидный образование, гипоэхогенный очаг, гиперэхогенный очаг, очаговый изменение, гемангиома]
    where: [liver]

  pancreatic_lesion:
